<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pneumonia Detection{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="header">
    <div class="container">
      <h1><i class="fas fa-lungs"></i> Pneumonia Detection System</h1>
      <p>Upload a chest X-ray image to detect pneumonia</p>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center py-4 text-muted">
    <p>Pneumonia Detection System &copy; 2025</p>
    <b>Developed by Bhargav sunkara</b>
    <p><i>MCA Final Year project</i></P>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
