<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="4pIBh8fChFwGXVTOJVQEqzlFJlTo69eRzhhUuUPhvvM" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pneumonia Detection</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <h1 class="display-4 mb-4 animate__animated animate__fadeIn">
                    <i class="fas fa-lungs text-danger me-2"></i> Pneumonia Detection
                </h1>
                <p class="lead text-muted animate__animated animate__fadeIn animate__delay-1s">
                    Upload a chest X-ray to detect pneumonia with Deep learning
                </p>

                <!-- Upload Card -->
                <div class="card shadow-lg animate__animated animate__fadeIn animate__delay-2s">
                    <div class="card-body p-5">
                        <form id="uploadForm" action="/predict" method="POST" enctype="multipart/form-data">
                            <div class="mb-4">
                                <label for="fileInput" class="upload-label">
                                    <div class="upload-area p-5 border-2 border-dashed rounded-3" id="dropZone">
                                        <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i>
                                        <h5>Drag & Drop X-ray Image</h5>
                                        <p class="text-muted small">or click to browse (JPEG/PNG)</p>
                                    </div>
                                    <input type="file" id="fileInput" name="file" accept="image/*" class="d-none" required>
                                </label>
                            </div>

                            <div id="previewContainer" class="mb-4 d-none">
                                <img id="imagePreview" src="#" alt="Preview" class="img-fluid rounded shadow">
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg px-5" id="analyzeBtn">
                                <span id="btnText">Analyze X-ray</span>
                                <span id="loadingSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Model Info -->
                <div class="row mt-5 animate__animated animate__fadeIn animate__delay-3s">
                    <div class="col-md-6 mb-4">
                        <div class="card h-100 border-0 shadow-sm">
                            <div class="card-body text-center">
                                <i class="fas fa-brain fa-3x text-info mb-3"></i>
                                <h3>Model Accuracy</h3>
                                <div class="progress mt-3" style="height: 25px;">
                                    <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" 
                                         role="progressbar" style="width: 92.5%">92.5%</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="card h-100 border-0 shadow-sm">
                            <div class="card-body text-center">
                                <i class="fas fa-images fa-3x text-warning mb-3"></i>
                                <h3>Trained Images</h3>
                                <h2 class="display-4 text-dark mt-3">5,856</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/voice.js') }}"></script>
    <hr>
    <footer>
      <center>
        <i class='fas fa-user-graduate' style='font-size:24px'></i> &nbsp <b>Developed by Bhargav kumar sunkara</b>
      <p> MCA Final year project</p>
      </center>
    </body>
</html>
